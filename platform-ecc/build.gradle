plugins {
    id 'java-library'
    id 'org.jetbrains.kotlin.jvm'
    id 'com.gradleup.shadow' version '9.4.1'
    id 'com.google.devtools.ksp' version '2.3.6'
}

group = 'org.exploit'
version = '2.2.1'

repositories {
    mavenCentral()
    maven {
        name = "sonatypeCentralSnapshots"
        url = uri("https://central.sonatype.com/repository/maven-snapshots/")
        mavenContent {
            snapshotsOnly()
        }
    }
}

dependencies {
    testImplementation 'org.jetbrains.kotlin:kotlin-test'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.14.3'
    testImplementation(project(':'))
    compileOnly(project(':'))

    api 'org.exploit.anvil:ecc-secp256k1:0.2.0'
    api 'org.exploit.anvil:ecc-ed25519:0.2.0'
    api 'org.exploit.anvil:ecc-p256:0.2.0'

    implementation 'org.exploit.anvil:t-ecdsa:0.2.0'
    implementation 'org.exploit.anvil:t-schnorr:0.2.0'
    implementation 'org.exploit.anvil:frost-ed25519:0.2.0'
    implementation 'org.exploit.anvil:frost-secp256k1:0.2.0'
    implementation 'org.exploit.anvil:frost-p256:0.2.0'
    implementation 'org.exploit.anvil:zk-dlog:0.2.0'

    ksp "io.micronaut:micronaut-inject-kotlin:4.10.8"
}

kotlin {
    jvmToolchain(25)
}

test {
    useJUnitPlatform()
}
