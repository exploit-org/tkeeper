name: Release Gate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Run release gate
        run: ./gradlew releaseGate --no-daemon --stacktrace

      - name: Dump failed container logs
        if: failure()
        shell: bash
        run: |
          docker version
          docker compose version
          docker ps -a --no-trunc

          while IFS= read -r container_id; do
            name="$(docker inspect --format '{{.Name}}' "$container_id" 2>/dev/null || true)"
            [[ -n "$name" ]] || continue
            echo "::group::${name#/}"
            docker inspect --format '{{json .State}}' "$container_id" || true
            docker logs "$container_id" 2>&1 || true
            echo "::endgroup::"
          done < <(docker ps -aq --filter label=com.docker.compose.service)
